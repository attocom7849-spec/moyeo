<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fd" />
  <meta name="description" content="모두의 출발지와 시간을 고려해 공평한 모임 장소를 추천해요." />
  <title>모여 — 모두에게 편한 약속 장소</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Gowun+Dodum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.5/kakao.min.js" integrity="sha384-v6JKY3z4FUkWq21oZDHZe74YvuPk/WUrVLrDHTBojHXClOSa3iXy7sCXPY1jkFbj" crossorigin="anonymous"></script>
  <script src="./config.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="모여 홈"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>모여</span></a>
      <div class="side-label">YOUR SPACE</div>
      <nav class="side-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>대시보드</button>
        <button class="nav-item" data-view="create"><span class="nav-icon">＋</span>새 모임 만들기</button>
      </nav>
      <div class="side-label recent-label">최근 모임</div>
      <div id="recentMeetings" class="recent-list"><div class="empty-recent">아직 모임이 없어요.<br />첫 모임을 만들어볼까요?</div></div>
      <div class="side-bottom"><div class="help-icon">?</div><div><b>모여가 처음인가요?</b><small>공평한 장소 찾기 안내</small></div><span class="chev">↗</span></div>
      <div class="side-user"><div class="avatar avatar-blue">나</div><div><b>게스트 사용자</b><small>초대 링크로 참여 중</small></div><span class="more">•••</span></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="mobile-brand brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>모여</span></div><div class="breadcrumbs"><span>내 공간</span><span class="crumb-slash">/</span><b id="breadcrumb">대시보드</b></div><div class="top-actions"><button class="icon-button" id="helpBtn" aria-label="도움말">?</button><div class="avatar avatar-blue">나</div></div></header>
      <div class="content-wrap" id="app"></div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="모바일 메뉴"><button class="mobile-nav-item active" data-view="home"><span>⌂</span>홈</button><button class="mobile-nav-item" data-view="create"><span>＋</span>모임 만들기</button><button class="mobile-nav-item" data-view="meetings"><span>▤</span>모임</button></nav>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modal" aria-hidden="true"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="닫기">×</button><div class="modal-icon">✦</div><h2 id="modalTitle">모여 사용 안내</h2><p>모임을 만들고 초대 링크를 공유하세요. 친구들이 각자의 출발지와 시간을 입력하면 모두에게 공평한 만남 장소를 추천해드려요.</p><button class="btn btn-primary full" id="modalOk">알겠어요</button></section></div>
  <script src="./app.js"></script>
</body>
</html>
